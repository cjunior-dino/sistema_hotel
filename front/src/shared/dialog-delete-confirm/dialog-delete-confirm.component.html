<h2 mat-dialog-title>
    Confirmar exclusão
</h2>
<mat-dialog-content>
    Voce tem certeza que deseja excluir este item?
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">Não</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Sim</button>
</mat-dialog-actions>
