<mat-card appearance="outlined" class="flex flex-column m-5 p-3" >
    @if (object?.id) {
        <h4>EDITAR PAGAMENTO</h4>
    } @else {
        <h4>CRIAR PAGAMENTO</h4>
    }

    <form [formGroup]="formGroup">
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>VALOR TOTAL PAGAMENTO</mat-label>
                <input matInput placeholder="Digite o valor total do pagamento.." formControlName="total_payment">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>TIPO DE PAGAMENTO</mat-label>
                <input matInput placeholder="Informe o tipo do pagamento.." formControlName="type">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>DESCONTO</mat-label>
                <input matInput placeholder="Informe o desconto.." formControlName="discount">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>VALOR PAGAMENTO</mat-label>
                <input matInput placeholder="Digite o valor do pagamento.." formControlName="value_payment">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>MÉTODO DE PAGAMENTO</mat-label>
                <input matInput placeholder="Digite o método de pagamento.." formControlName="payment_method">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>FUNCIONÁRIO</mat-label>
                <input matInput placeholder="Digite o funcionário.." formControlName="employee">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>RESERVA</mat-label>
                <input matInput placeholder="Digite a reserva.." formControlName="reservation">
            </mat-form-field>
        </div>

        <div class="flex flex-row justify-content-end gap-3 mt-3">
            <button mat-raised-button color="warn" (click)="goToPage('/payment')">
                Voltar
            </button>
            <button mat-raised-button color="primary" (click)="saveOrUpdateForm()" [disabled]="formGroup.invalid">
                Salvar
            </button>

            <!--            <button mat-raised-button color="warn" (click)="cancel()">-->
            <!--                Cancelar-->
            <!--            </button>-->
        </div>

    </form>

</mat-card>
