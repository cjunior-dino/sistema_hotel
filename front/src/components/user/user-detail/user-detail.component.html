<mat-card appearance="outlined" class="flex flex-column m-5 p-3" >
    @if (object?.id) {
        <h4>EDITAR USUÁRIO</h4>
    } @else {
        <h4>CRIAR USUÁRIO</h4>
    }

    <form [formGroup]="formGroup">
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>NOME DO USUÁRIO</mat-label>
                <input matInput placeholder="Digite o nome do usuário.." formControlName="name">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>DATA DE NASCIMENTO</mat-label>
                <input matInput placeholder="Digite a data de nascimento" formControlName="dt_birth">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>CPF</mat-label>
                <input matInput placeholder="Digite o CPF.." formControlName="cpf">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>CONTATO</mat-label>
                <input matInput placeholder="Digite o número de telefone.." formControlName="phone">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>EMAIL</mat-label>
                <input matInput placeholder="Digite o e-mail.." formControlName="email">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>Senha</mat-label>
                <input matInput placeholder="Digite a senha.." formControlName="password">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>Usuário</mat-label>
                <input matInput placeholder="Digite o usuário.." formControlName="username">
            </mat-form-field>
        </div>


        <div class="flex flex-row justify-content-end gap-3 mt-3">
            <button mat-raised-button color="warn" (click)="goToPage('/users')">
                Voltar
            </button>
            <button mat-raised-button color="primary" (click)="saveOrUpdateForm()" [disabled]="formGroup.invalid">
                Salvar
            </button>

            <!--            <button mat-raised-button color="warn" (click)="cancel()">-->
            <!--                Cancelar-->
            <!--            </button>-->
        </div>

    </form>

</mat-card>
