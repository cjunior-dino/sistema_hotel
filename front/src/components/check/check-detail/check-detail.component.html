<mat-card appearance="outlined" class="flex flex-column m-5 p-3" >
    @if (object?.id) {
        <h4>EDITAR CHECK</h4>
    } @else {
        <h4>CRIAR CHECK</h4>
    }

    <form [formGroup]="formGroup">
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>TIPO DO CHECK</mat-label>
                <input matInput placeholder="Digite o tipo do check.." formControlName="type">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>FUNCIONÁRIO DA RESERVA</mat-label>
                <input matInput placeholder="Digite o funcionário da reserva.." formControlName="employee">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>NUMÉRO DA RESERVA</mat-label>
                <input matInput placeholder="Digite a reserva.." formControlName="reservation">
            </mat-form-field>
        </div>

        <div class="flex flex-row justify-content-end gap-3 mt-3">
            <button mat-raised-button color="warn" (click)="goToPage('/check')">
                Voltar
            </button>
            <button mat-raised-button color="primary" (click)="saveOrUpdateForm()" [disabled]="formGroup.invalid">
                Salvar
            </button>

            <!--            <button mat-raised-button color="warn" (click)="cancel()">-->
            <!--                Cancelar-->
            <!--            </button>-->
        </div>

    </form>

</mat-card>
