<mat-card appearance="outlined" class="flex flex-column m-5 p-3" >
    @if (object?.id) {
        <h4>EDITAR RESERVA</h4>
    } @else {
        <h4>CRIAR RESERVA</h4>
    }

    <form [formGroup]="formGroup">
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>VALOR DIÁRIA</mat-label>
                <input matInput placeholder="Digite o valor da diária.." formControlName="daily_value">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>VALOR TOTAL</mat-label>
                <input matInput placeholder="Valor total da reserva.." formControlName="total_value">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>DATA ENTRADA</mat-label>
                <input matInput placeholder="Informe a data da entrada.." formControlName="dt_begin">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>DATA SAÍDA</mat-label>
                <input matInput placeholder="Informe a data de saída.." formControlName="dt_end">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>NÚMERO DO QUARTO</mat-label>
                <input matInput placeholder="Informe o quarto.." formControlName="room">
            </mat-form-field>
        </div>

        <div class="flex flex-row justify-content-end gap-3 mt-3">
            <button mat-raised-button color="warn" (click)="goToPage('/reservation')">
                Voltar
            </button>
            <button mat-raised-button color="primary" (click)="saveOrUpdateForm()" [disabled]="formGroup.invalid">
                Salvar
            </button>

            <!--            <button mat-raised-button color="warn" (click)="cancel()">-->
            <!--                Cancelar-->
            <!--            </button>-->
        </div>

    </form>

</mat-card>
