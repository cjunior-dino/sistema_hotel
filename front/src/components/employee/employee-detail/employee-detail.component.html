<mat-card appearance="outlined" class="flex flex-column m-5 p-3" >
    @if (object?.id) {
        <h4>EDITAR FUNCIONÁRIO</h4>
    } @else {
        <h4>CRIAR FUNCIONÁRIO</h4>
    }

    <form [formGroup]="formGroup">
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>SALÁRIO</mat-label>
                <input matInput placeholder="Digite o salário.." formControlName="salary">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>NÍVEL</mat-label>
                <input matInput placeholder="Digite o nível.." formControlName="level">
            </mat-form-field>
        </div>
        <div class="flex flex-column gap-3">
            <mat-form-field>
                <mat-label>POSIÇÃO</mat-label>
                <input matInput placeholder="Digite o cargo.." formControlName="position">
            </mat-form-field>
        </div>

        <div class="flex flex-row justify-content-end gap-3 mt-3">
            <button mat-raised-button color="warn" (click)="goToPage('/employee')">
                Voltar
            </button>
            <button mat-raised-button color="primary" (click)="saveOrUpdateForm()" [disabled]="formGroup.invalid">
                Salvar
            </button>

            <!--            <button mat-raised-button color="warn" (click)="cancel()">-->
            <!--                Cancelar-->
            <!--            </button>-->
        </div>

    </form>

</mat-card>
